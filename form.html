<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review – WDD 131 – Marcos E. da Silva</title>
  <meta name="description" content="A product review form for WDD 131 with a product list built by JavaScript, star rating, and useful features.">
  <meta name="author" content="Marcos E. da Silva">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/getdates.js" defer></script>
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">
      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset class="rating">
        <legend>Overall Rating</legend>
        <label for="rating1">&star;<input type="radio" id="rating1" name="rating" value="1" required></label>
        <label for="rating2">&star;&star;<input type="radio" id="rating2" name="rating" value="2" required></label>
        <label for="rating3">&star;&star;&star;<input type="radio" id="rating3" name="rating" value="3" required></label>
        <label for="rating4">&star;&star;&star;&star;<input type="radio" id="rating4" name="rating" value="4" required></label>
        <label for="rating5">&star;&star;&star;&star;&star;<input type="radio" id="rating5" name="rating" value="5" required></label>
      </fieldset>

      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>

      <fieldset class="features">
        <legend>Which features did you find useful in the product? <em>(Check all that apply)</em></legend>
        <label for="durability"><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
        <label for="easeOfUse"><input type="checkbox" id="easeOfUse" name="features" value="ease-of-use"> Ease of Use</label>
        <label for="performance"><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
        <label for="design"><input type="checkbox" id="design" name="features" value="design"> Design</label>
      </fieldset>

      <label for="review">Written Review <span class="optional">(Optional)</span></label>
      <textarea id="review" name="review" rows="5"></textarea>

      <label for="userName">Your Name <span class="optional">(Optional)</span></label>
      <input type="text" id="userName" name="userName">

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Marcos E. da Silva &middot; Santa Catarina, Brasil 🇧🇷</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
